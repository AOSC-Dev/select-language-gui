[package]
name = "select-language"
version = "0.2.1"
description = "GUI greeter to select AOSC OS session language"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem
# (still supported by Tauri 2, kept for the AOSC `abbs` build which passes it explicitly)
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
